<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards – Tentaplugg</title>

<style>
/* =========================================================
   CLEAN DARK + ORANGE THEME
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0d10;
    color:#f3f4f6;
}

/* =========================================================
   HEADER
========================================================= */

header{
    background:#11151a;
    color:#ffffff;
    padding:28px 24px;
    text-align:center;
    border-bottom:1px solid #252a31;
    box-shadow:0 4px 20px rgba(0,0,0,.35);
}

header h1{
    margin:0 0 8px;
    font-size:30px;
    letter-spacing:-.4px;
}

.sub{
    color:#9ca3af;
    opacity:1;
}

/* =========================================================
   MAIN
========================================================= */

main{
    max-width:900px;
    margin:30px auto;
    padding:0 18px;
}

/* =========================================================
   MODE – FLASHCARDS / QUIZ
========================================================= */

.mode-buttons{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.mode-btn{
    background:#15191e;
    color:#9ca3af;
    border:1px solid #2a3038;
    border-radius:10px;
    padding:12px 18px;
    font-weight:700;
    cursor:pointer;
    font-size:15px;
    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .15s ease;
}

.mode-btn:hover{
    background:#1b2026;
    color:#ffffff;
    border-color:#3a414b;
    filter:none;
}

.mode-btn.active{
    background:#f97316;
    color:#111111;
    border-color:#f97316;
    box-shadow:0 4px 14px rgba(249,115,22,.22);
}

/* =========================================================
   CATEGORIES
========================================================= */

.categories{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-weight:700;
    cursor:pointer;
    font-size:15px;
    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .15s ease,
        box-shadow .2s ease;
}

button:hover{
    filter:none;
    transform:translateY(-1px);
}

button:active{
    transform:translateY(0);
}

.cat{
    background:#15191e;
    color:#cbd5e1;
    border:1px solid #2a3038;
}

.cat:hover{
    background:#1b2026;
    color:#ffffff;
    border-color:#3a414b;
}

.cat.active{
    background:#f97316;
    color:#111111;
    border-color:#f97316;
    box-shadow:0 4px 14px rgba(249,115,22,.18);
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:flex;
    justify-content:space-between;
    gap:12px;
    background:#15191e;
    padding:14px 18px;
    border-radius:12px;
    margin-bottom:18px;
    border:1px solid #252a31;
    box-shadow:0 6px 20px rgba(0,0,0,.22);
    flex-wrap:wrap;
    color:#d1d5db;
}

/* =========================================================
   FLASHCARD
========================================================= */

.card-wrap{
    perspective:1200px;
    height:430px;
}

.card{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:.55s;
    cursor:pointer;
}

.card.flipped{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:#15191e;
    border:1px solid #292f37;
    border-radius:20px;
    padding:35px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:
        0 15px 40px rgba(0,0,0,.32),
        0 0 0 1px rgba(255,255,255,.015);
}

.back{
    transform:rotateY(180deg);
    background:#171b20;
    border-color:#313842;
}

.label{
    position:absolute;
    top:20px;
    left:22px;
    font-size:13px;
    font-weight:bold;
    color:#f97316;
    letter-spacing:.3px;
}

.face h2{
    font-size:28px;
    max-width:760px;
    color:#f9fafb;
    line-height:1.35;
}

.answer{
    font-size:22px;
    line-height:1.55;
    max-width:760px;
    color:#e5e7eb;
}

.hint{
    position:absolute;
    bottom:20px;
    color:#6b7280;
    font-size:14px;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.prev{
    background:#242a32;
    color:#e5e7eb;
    border:1px solid #343b45;
}

.prev:hover{
    background:#2d343e;
}

.mark{
    background:#292217;
    color:#fbbf24;
    border:1px solid #5b451a;
}

.mark:hover{
    background:#352a19;
}

.mark.active{
    background:#f59e0b;
    color:#111111;
    border-color:#f59e0b;
    box-shadow:0 4px 14px rgba(245,158,11,.2);
}

.remove{
    background:#35191b;
    color:#fca5a5;
    border:1px solid #6b272c;
}

.remove:hover{
    background:#472024;
}

.reset{
    background:#242a32;
    color:#cbd5e1;
    border:1px solid #343b45;
}

.reset:hover{
    background:#2d343e;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    background:#15191e;
    border:1px solid #292f37;
    border-radius:18px;
    padding:50px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    color:#cbd5e1;
}

/* =========================================================
   QUIZ CARD
========================================================= */

.quiz-card{
    background:#15191e;
    border:1px solid #292f37;
    border-radius:20px;
    padding:35px;
    min-height:430px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    box-shadow:
        0 15px 40px rgba(0,0,0,.32),
        0 0 0 1px rgba(255,255,255,.015);
}

.quiz-label{
    font-size:13px;
    font-weight:bold;
    color:#f97316;
    margin-bottom:20px;
    letter-spacing:.3px;
}

.quiz-question{
    font-size:28px;
    line-height:1.35;
    max-width:760px;
    margin:0 auto 30px;
    color:#f9fafb;
}

/* =========================================================
   QUIZ OPTIONS
========================================================= */

.quiz-options{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:700px;
    width:100%;
    margin:0 auto;
}

.quiz-option{
    width:100%;
    background:#1b2026;
    color:#e5e7eb;
    border:2px solid #303740;
    border-radius:14px;
    padding:18px 20px;
    font-size:18px;
    font-weight:600;
    text-align:left;
    transition:
        background .2s ease,
        border-color .2s ease,
        transform .15s ease,
        box-shadow .2s ease;
}

.quiz-option:hover:not(:disabled){
    background:#222830;
    border-color:#f97316;
    color:#ffffff;
    box-shadow:0 5px 18px rgba(249,115,22,.12);
    transform:translateY(-1px);
}

.quiz-option:disabled{
    cursor:default;
    opacity:1;
}

/* =========================================================
   QUIZ CORRECT / WRONG
========================================================= */

.quiz-option.correct-answer{
    background:#12291d;
    border-color:#22c55e;
    color:#86efac;
    box-shadow:0 5px 18px rgba(34,197,94,.12);
}

.quiz-option.wrong-answer{
    background:#301719;
    border-color:#ef4444;
    color:#fca5a5;
    box-shadow:0 5px 18px rgba(239,68,68,.12);
}

.quiz-feedback{
    min-height:28px;
    margin-top:22px;
    font-size:18px;
    font-weight:700;
}

.quiz-feedback.correct-feedback{
    color:#4ade80;
}

.quiz-feedback.wrong-feedback{
    color:#f87171;
}

/* =========================================================
   NEXT BUTTON
========================================================= */

.quiz-next{
    display:none;
    margin:20px auto 0;
    background:#f97316;
    color:#111111;
    border:1px solid #f97316;
    box-shadow:0 5px 18px rgba(249,115,22,.18);
}

.quiz-next:hover{
    background:#fb923c;
}

.quiz-next.show{
    display:inline-block;
}

/* =========================================================
   RESULT
========================================================= */

.result,
.quiz-result{
    background:#15191e;
    border:1px solid #292f37;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    color:#e5e7eb;
}

.result h2,
.quiz-result h2{
    margin-top:0;
    text-align:center;
    color:#f9fafb;
}

.result-score,
.quiz-score{
    text-align:center;
    font-size:34px;
    font-weight:800;
    margin:20px 0;
    color:#f97316;
}

.result-stats,
.quiz-result-stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.result-stat,
.quiz-result-stat{
    padding:14px 20px;
    border-radius:12px;
    font-weight:700;
    border:1px solid transparent;
}

.result-right,
.quiz-right{
    background:#12291d;
    color:#86efac;
    border-color:#245d3a;
}

.result-wrong,
.quiz-wrong{
    background:#301719;
    color:#fca5a5;
    border-color:#6b292d;
}

.result-total,
.quiz-total{
    background:#1e2228;
    color:#d1d5db;
    border-color:#353b44;
}

/* =========================================================
   RESULT SECTIONS
========================================================= */

.result-section,
.quiz-result-section{
    margin-top:28px;
}

.result-section h3,
.quiz-result-section h3{
    margin-bottom:12px;
    color:#f3f4f6;
}

.result-item,
.quiz-result-item{
    background:#1b2026;
    border:1px solid #2c333c;
    border-left:5px solid #22c55e;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
}

.result-item.wrong-item,
.quiz-result-item.wrong-item{
    border-left-color:#ef4444;
}

.result-question,
.quiz-result-question{
    font-weight:700;
    margin-bottom:8px;
    color:#f3f4f6;
}

.result-answer,
.quiz-result-answer{
    color:#aeb6c2;
    line-height:1.5;
}

/* =========================================================
   RESULT ACTIONS
========================================================= */

.result-actions,
.quiz-result-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:30px;
}

.result-actions button,
.quiz-result-actions button{
    font-size:16px;
}

.repeat,
.quiz-repeat{
    background:#f97316;
    color:#111111;
}

.repeat:hover,
.quiz-repeat:hover{
    background:#fb923c;
}

.shuffle,
.quiz-shuffle{
    background:#252b33;
    color:#dbeafe;
    border:1px solid #39414b;
}

.shuffle:hover,
.quiz-shuffle:hover{
    background:#303842;
}

.train-wrong,
.quiz-train-wrong{
    background:#35191b;
    color:#fca5a5;
    border:1px solid #6b272c;
}

.train-wrong:hover,
.quiz-train-wrong:hover{
    background:#472024;
}

.train-marked,
.quiz-train-marked{
    background:#3a2b13;
    color:#fbbf24;
    border:1px solid #71541c;
}

.train-marked:hover,
.quiz-train-marked:hover{
    background:#493716;
}

/* =========================================================
   GENERAL TEXT / SELECTION
========================================================= */

::selection{
    background:#f97316;
    color:#111111;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#0b0d10;
}

::-webkit-scrollbar-thumb{
    background:#303740;
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#454e59;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:22px 16px;
    }

    header h1{
        font-size:25px;
    }

    main{
        margin:22px auto;
        padding:0 12px;
    }

    .card-wrap{
        height:500px;
    }

    .face{
        padding:24px;
    }

    .face h2{
        font-size:23px;
    }

    .answer{
        font-size:18px;
    }

    .controls button{
        flex:1;
    }

    .stats{
        font-size:14px;
        padding:13px 15px;
    }

    .result,
    .quiz-result{
        padding:20px;
    }

    .quiz-card{
        padding:22px;
        min-height:500px;
    }

    .quiz-question{
        font-size:23px;
    }

    .quiz-option{
        font-size:16px;
        padding:16px;
    }

    .mode-btn{
        flex:1;
    }

    .categories{
        gap:7px;
    }

    .cat{
        padding:10px 13px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧠 Tentaplugg – Flashcards</h1>
    <div class="sub">Klicka på kortet för att vända det</div>
</header>

<main>

<div class="mode-buttons">

    <button
        id="flashcardModeBtn"
        class="mode-btn active"
        type="button">
        🧠 Flashcards
    </button>

    <button
        id="quizModeBtn"
        class="mode-btn"
        type="button">
        📝 Quiz
    </button>

</div>

<div id="categories" class="categories"></div>

<div class="stats">
    <span id="progress"></span>
    <span id="remaining"></span>
</div>

<div id="app"></div>

<div class="controls" id="controls">

    <button class="prev" id="prevBtn" type="button">
        ← Föregående
    </button>

    <button class="mark" id="markBtn" type="button">
        ⭐ Markera
    </button>

    <button class="remove" id="removeBtn" type="button">
        🗑 Ta bort
    </button>

    <button class="reset" id="resetBtn" type="button">
        ↺ Återställ borttagna
    </button>

</div>

</main>

<script>

const cards = [

    [
        "Immunförsvaret",
        "Vad är immunförsvaret?",
        "Immunförsvaret är kroppens eget försvar mot infektioner. Det skyddar mot bakterier, virus, svampar och parasiter."
    ],

    [
        "Immunförsvaret",
        "Vad är immunförsvarets viktigaste uppgift?",
        "Att identifiera och bekämpa smittämnen så att kroppen kan förhindra eller begränsa en infektion."
    ],

    [
        "Immunförsvaret",
        "Vad består lymfsystemet av?",
        "Lymfkörtlar, tonsiller (halsmandlar) och mjälte."
    ],

    [
        "Immunförsvaret",
        "Var finns lymfkörtlar?",
        "Bland annat i halsen, armhålorna och ljumskarna."
    ],

    [
        "Immunförsvaret",
        "Vad gör lymfkörtlarna?",
        "De fungerar som kroppens filterstationer och kan svullna vid infektion."
    ],

    [
        "Immunförsvaret",
        "Vad gör tonsillerna?",
        "De hjälper till att fånga upp bakterier och virus som kommer in via mun och näsa."
    ],

    [
        "Immunförsvaret",
        "Vad gör mjälten?",
        "Mjälten filtrerar blodet, tar bort gamla blodkroppar och hjälper immunförsvaret att bekämpa infektioner."
    ],

    [
        "Immunförsvaret",
        "Vilka är lymfsystemets viktigaste uppgifter?",
        "Att filtrera bort bakterier och virus, innehålla lymfocyter, hjälpa kroppen att bekämpa infektioner och transportera vätska tillbaka till blodet."
    ],

    [
        "Immunförsvaret",
        "Vad är vita blodkroppar?",
        "Celler som ingår i immunförsvaret och övervakar och skyddar kroppen mot infektioner."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad består det ospecifika immunförsvaret av?",
        "Det medfödda försvaret. Det reagerar snabbt och har inget minne av tidigare infektioner."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad innebär att immunförsvaret är ospecifikt?",
        "Det reagerar på samma sätt varje gång eftersom det inte har lärt sig att känna igen specifika tidigare sjukdomar."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vilka tre delar består det medfödda försvaret av?",
        "Fysiska och kemiska hinder, identifiering av mikroorganismer och aktivering av vita blodkroppar samt inflammationssvar."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vilka är kroppens fysiska barriärer?",
        "Huden, slemhinnorna och flimmerhåren."
    ],

    [
        "Ospecifika immunförsvaret",
        "Hur skyddar huden kroppen?",
        "Huden hindrar bakterier, virus och andra smittämnen från att ta sig in i kroppen."
    ],

    [
        "Ospecifika immunförsvaret",
        "Hur skyddar slemhinnorna kroppen?",
        "Slemmet fångar upp bakterier, virus och andra främmande partiklar."
    ],

    [
        "Ospecifika immunförsvaret",
        "Var finns slemhinnor?",
        "Bland annat i luftvägarna och urinvägarna."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad gör flimmerhåren?",
        "De fångar upp och för bort bakterier, virus och andra partiklar genom exempelvis hosta och nysningar."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vilka är kroppens kemiska barriärer?",
        "Bland annat magsyra, urin och normalflora."
    ],

    [
        "Ospecifika immunförsvaret",
        "Hur skyddar magsyran kroppen?",
        "Det låga pH-värdet dödar många bakterier och virus som kommer ner i magen."
    ],

    [
        "Ospecifika immunförsvaret",
        "Hur skyddar urinen kroppen?",
        "Urinen hjälper till att spola bort bakterier och det låga pH-värdet gör det svårare för bakterier att växa."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad är normalflora?",
        "Mikroorganismer som normalt finns på och i kroppen utan att orsaka sjukdom."
    ],

    [
        "Ospecifika immunförsvaret",
        "Hur skyddar normalfloran kroppen?",
        "Den konkurrerar med skadliga bakterier och svampar om plats och näring och hindrar dem från att ta över."
    ],

    [
        "Ospecifika immunförsvaret",
        "Var finns mycket av kroppens normalflora?",
        "Bland annat på huden och i tarmen."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vilka bakterier finns i tarmfloran?",
        "E. coli, Klebsiella och enterokocker."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vilka bakterier finns i mun- och näsfloran?",
        "Streptokocker, Staphylococcus aureus och laktobaciller."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vilka bakterier finns i hudfloran?",
        "Koagulasnegativa stafylokocker (KNS) och Staphylococcus aureus."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad kan granulocyter göra?",
        "De kan fagocytera bakterier och främmande material, frisätta dödliga enzymer och exempelvis väteperoxid samt söka sig till områden med inflammation."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad betyder fagocytera?",
        "Att äta upp bakterier och främmande material."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad är granulocyternas granula?",
        "Korn som innehåller ämnen och enzymer som kan döda mikroorganismer."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad kan granulocyter göra med sina granula?",
        "De kan släppa ut dem som en slags kemisk bomb mot mikroorganismer."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad är monocyter?",
        "Monocyter är de största av de vita blodkropparna."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad händer med monocyter när de lämnar blodet?",
        "De vandrar ut i vävnaderna och omvandlas till makrofager."
    ],

    [
        "Ospecifika immunförsvaret",
        "Vad är en makrofag?",
        "En storätande cell som äter upp exempelvis bakterier och tar hand om död vävnad."
    ],

    [
        "Ospecifika immunförsvaret",
        "Varför kallas makrofager för kroppens städpatrull?",
        "För att de tar hand om inkräktare och död vävnad."
    ],

    [
        "Ospecifika immunförsvaret",
        "Hur länge kan makrofager leva?",
        "De kan leva i flera år."
    ],

    [
        "Specifika immunförsvaret",
        "Vad består det specifika immunförsvaret av?",
        "Lymfocyter och antikroppar. Lymfocyterna omfattar bland annat antikroppsproducerande celler, hjälparceller, mördarceller och minnesceller."
    ],

    [
        "Specifika immunförsvaret",
        "Vad gör en lymfocyt?",
        "Lymfocyter bildas i benmärgen, mognar i lymfsystemet och har många olika uppgifter i immunförsvaret."
    ],

    [
        "Specifika immunförsvaret",
        "Vad är ett antigen?",
        "Något som immunförsvaret reagerar på."
    ],

    [
        "Specifika immunförsvaret",
        "Vad kan vara ett antigen?",
        "Exempelvis en del av en bakterie, en del av ett virus, pollen, ett läkemedel eller till och med en del av kroppen."
    ],

    [

(function(){

);

let marked = JSON.parse(

);

let results = {};
let customList = null;

/* =========================
   HJÄLPFUNKTIONER
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function formatAnswer(value){

    return escapeHtml(value)
        .replace(/\n/g,"<br>");

}

function saveMarked(){

    localStorage.setItem(
        MARKED_KEY,
        JSON.stringify(marked)
    );

}

function saveRemoved(){

    localStorage.setItem(
        REMOVED_KEY,
        JSON.stringify(removed)
    );

}

function isMarked(originalIndex){

    return marked.includes(originalIndex);

}

function getCategories(){

    return [
        "Alla",
        "⭐ Markerade",
        ...new Set(cards.map(card => card[0]))
    ];

}


/* =========================
   HÄMTA TILLGÄNGLIGA KORT
========================= */

function getAvailableCards(){

    let list = cards
        .map((card,originalIndex)=>({
            card,
            originalIndex
        }))
        .filter(item => {

            if(
                removed.includes(item.originalIndex)
            ){
                return false;
            }

            if(
                activeCategory === "⭐ Markerade"
            ){
                return isMarked(item.originalIndex);
            }

            if(
                activeCategory === "Alla"
            ){
                return item.card[0] !==
                    "Endast frågor från Worddokument";
            }

            return item.card[0] === activeCategory;

        });

    if(customList !== null){

        const allowed =
            new Set(customList);

        list = list.filter(item =>
            allowed.has(item.originalIndex)
        );

    }

    return list;

}


/* =========================
   KATEGORIER
========================= */

function renderCategories(){

    categoriesElement.innerHTML = "";

    getCategories().forEach(category => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "cat" +
            (
                category === activeCategory
                    ? " active"
                    : ""
            );

        button.textContent = category;

        button.addEventListener("click",()=>{

            activeCategory = category;

            customList = null;

            index = 0;

            results = {};

            roundStarted = false;

            renderCategories();
            render();

        });

        categoriesElement.appendChild(button);

    });

}


/* =========================
   STATISTIK
========================= */

function updateStats(list){

    if(!list.length){

        progress.textContent = "Klart!";

        remaining.textContent =
            "0 kort kvar";

        return;

    }

    progress.textContent =
        `Kort ${index + 1} av ${list.length}`;

    const right =
        Object.values(results)
            .filter(value => value === "right")
            .length;

    const wrong =
        Object.values(results)
            .filter(value => value === "wrong")
            .length;

    const markedCount =
        marked.filter(
            item => !removed.includes(item)
        ).length;

    remaining.textContent =
        `✅ ${right} rätt | ❌ ${wrong} fel | ⭐ ${markedCount} markerade`;

}

========================= */

function render(){

/* =========================

function answerQuestion(type){

    const list =
        getAvailableCards();

    if(!list.length){
        return;
    }

    const originalIndex =
        list[index].originalIndex;

    results[originalIndex] =
        type;

    roundStarted = true;

    index++;

    if(index >= list.length){

        showResults(list);

        return;

    }

    render();

}


/* =========================
   FÖREGÅENDE
========================= */

function previous(){

    const list =
        getAvailableCards();

    if(!list.length){
        return;
    }

    index--;

    if(index < 0){
        index = list.length - 1;
    }

    render();

}


/* =========================
   MARKERA
========================= */

function toggleMark(){

    const list =
        getAvailableCards();

    if(!list.length){
        return;
    }

    const originalIndex =
        list[index].originalIndex;

    if(isMarked(originalIndex)){

        marked =
            marked.filter(
                item => item !== originalIndex
            );

    }else{

        marked.push(originalIndex);

    }

    saveMarked();

    /*
       Om vi befinner oss i ⭐ Markerade
       och tar bort markeringen försvinner
       frågan automatiskt ur kategorin.
    */

    if(activeCategory === "⭐ Markerade"){

        const newList =
            getAvailableCards();

        if(index >= newList.length){

            index =
                Math.max(0,newList.length - 1);

        }

    }

    render();

}


/* =========================

========================= */

function removeCard(){

    const list =
        getAvailableCards();

    if(!list.length){
        return;
    }

    const originalIndex =
        list[index].originalIndex;

    if(!removed.includes(originalIndex)){

        removed.push(originalIndex);

        saveRemoved();

    }

    /*
       ⭐-markeringen lämnas kvar.
       Om kortet återställs kommer markeringen
       därför fortfarande finnas.
    */

    const newList =
        getAvailableCards();

    if(index >= newList.length){

        index =
            Math.max(0,newList.length - 1);

    }

    render();

}

========================= */

    */

    index = 0;

    results = {};

    render();

}


/* =========================
   BLANDA
========================= */

function shuffleArray(array){

    const arr =
        [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}

        });

    });

    document.getElementById("quizNextBtn").addEventListener("click",()=>{
        quizIndex++;
        renderQuiz();
    });

}

function answerQuiz(selectedButton,item){

    if(quizAnswered){
        return;
    }

    quizAnswered = true;

    const correct = selectedButton.dataset.correct === "true";

    quizResults[item.originalIndex] = correct ? "right" : "wrong";

    document.querySelectorAll(".quiz-option").forEach(button => {

        button.disabled = true;

        if(button.dataset.correct === "true"){
            button.classList.add("correct-answer");
        }

    });

    if(!correct){
        selectedButton.classList.add("wrong-answer");
    }

    const feedback = document.getElementById("quizFeedback");

    if(correct){
        feedback.textContent = "✅ Rätt svar!";
        feedback.className = "quiz-feedback correct-feedback";
    }else{
        feedback.textContent = "❌ Fel svar! Det gröna alternativet är rätt.";
        feedback.className = "quiz-feedback wrong-feedback";
    }

    document.getElementById("quizNextBtn").classList.add("show");

}

function quizPrevious(){

    if(quizIndex > 0){
        quizIndex--;
        renderQuiz();
    }

}

function quizToggleMark(){

    const list = getQuizCards();

    if(!list.length){
        return;
    }

    const originalIndex = list[quizIndex].originalIndex;

    if(isMarked(originalIndex)){
        marked = marked.filter(item => item !== originalIndex);
    }else{
        marked.push(originalIndex);
    }

    saveMarked();
    renderQuizCategories();
    renderQuiz();

}

function quizRemoveCard(){

    const list = getQuizCards();

    if(!list.length){
        return;
    }

    const originalIndex = list[quizIndex].originalIndex;

    if(!removed.includes(originalIndex)){
        removed.push(originalIndex);
        saveRemoved();
    }

    const newList = getQuizCards();

    if(quizIndex >= newList.length){
        quizIndex = Math.max(0,newList.length - 1);
    }

    renderQuizCategories();
    renderQuiz();

}

function quizResetCards(){

    removed = [];
    localStorage.removeItem(REMOVED_KEY);

    quizIndex = 0;
    quizList = null;
    quizResults = {};
    quizAnswered = false;

    controls.style.display = "";
    renderQuizCategories();
    renderQuiz();

}

function showQuizResults(list){

    controls.style.display = "none";

    const answered = list.filter(item => quizResults[item.originalIndex]);
    const right = answered.filter(item => quizResults[item.originalIndex] === "right");
    const wrong = answered.filter(item => quizResults[item.originalIndex] === "wrong");
    const total = answered.length;
    const percentage = total ? Math.round((right.length / total) * 100) : 0;

    progress.textContent = "🎉 Quizet är klart!";
    remaining.textContent = `${right.length} rätt av ${total}`;

    const rightHtml = right.length ? right.map(item => `
        <div class="quiz-result-item">
            <div class="quiz-result-question">${escapeHtml(item.card[1])}</div>
            <div class="quiz-result-answer">${formatAnswer(item.card[2])}</div>
        </div>
    `).join("") : "<p>Inga rätt svar.</p>";

    const wrongHtml = wrong.length ? wrong.map(item => `
        <div class="quiz-result-item wrong-item">
            <div class="quiz-result-question">${escapeHtml(item.card[1])}</div>
            <div class="quiz-result-answer">Rätt svar: ${formatAnswer(item.card[2])}</div>
        </div>
    `).join("") : "<p>Inga fel svar 🎉</p>";

    app.innerHTML = `
        <div class="quiz-result">
            <h2>🎉 Quizresultat</h2>

            <div class="quiz-score">${percentage}%</div>

            <div class="quiz-result-stats">
                <div class="quiz-result-stat quiz-total">📚 ${total} besvarade</div>
                <div class="quiz-result-stat quiz-right">✅ ${right.length} rätt</div>
                <div class="quiz-result-stat quiz-wrong">❌ ${wrong.length} fel</div>
            </div>

            <div class="quiz-result-section">
                <h3>✅ Rätt svar</h3>
                ${rightHtml}
            </div>

            <div class="quiz-result-section">
                <h3>❌ Fel svar</h3>
                ${wrongHtml}
            </div>

            <div class="quiz-result-actions">
                <button id="quizRepeatBtn" class="quiz-repeat" type="button">🔁 Gör om</button>
                <button id="quizShuffleBtn" class="quiz-shuffle" type="button">🔀 Blanda</button>
                ${wrong.length ? '<button id="quizWrongBtn" class="quiz-train-wrong" type="button">❌ Träna på fel</button>' : ''}
                ${marked.filter(i => !removed.includes(i)).length ? '<button id="quizMarkedBtn" class="quiz-train-marked" type="button">⭐ Träna på markerade</button>' : ''}
            </div>
        </div>
    `;

    document.getElementById("quizRepeatBtn").addEventListener("click",()=>{
        quizList = list.map(item => item.originalIndex);
        quizIndex = 0;
        quizResults = {};
        quizAnswered = false;
        controls.style.display = "";
        renderQuiz();
    });

    document.getElementById("quizShuffleBtn").addEventListener("click",()=>{
        quizList = shuffleArray(list.map(item => item.originalIndex));
        quizIndex = 0;
        quizResults = {};
        quizAnswered = false;
        controls.style.display = "";
        renderQuiz();
    });

    if(wrong.length){
        document.getElementById("quizWrongBtn").addEventListener("click",()=>{
            quizList = shuffleArray(wrong.map(item => item.originalIndex));
            quizIndex = 0;
            quizResults = {};
            quizAnswered = false;
            controls.style.display = "";
            renderQuiz();
        });
    }

    const markedAvailable = marked.filter(i => !removed.includes(i));

    if(markedAvailable.length){
        document.getElementById("quizMarkedBtn").addEventListener("click",()=>{
            activeCategory = "⭐ Markerade";
            quizList = shuffleArray(markedAvailable);
            quizIndex = 0;
            quizResults = {};
            quizAnswered = false;
            controls.style.display = "";
            renderQuizCategories();
            renderQuiz();
        });
    }

}

flashcardModeBtn.addEventListener("click",()=>{

    currentMode = "flashcards";
    flashcardModeBtn.classList.add("active");
    quizModeBtn.classList.remove("active");
    quizList = null;
    quizIndex = 0;
    quizResults = {};
    quizAnswered = false;
    controls.style.display = "";
    renderCategories();
    render();

});

quizModeBtn.addEventListener("click",()=>{

    currentMode = "quiz";
    quizModeBtn.classList.add("active");
    flashcardModeBtn.classList.remove("active");
    quizList = null;
    quizIndex = 0;
    quizResults = {};
    quizAnswered = false;
    controls.style.display = "";
    renderQuizCategories();
    renderQuiz();

});

/* =========================
   KONTROLLER
========================= */

prevBtn.addEventListener(
    "click",
    function(){
        if(currentMode === "quiz"){
            quizPrevious();
        }else{
            previous();
        }
    }
);

markBtn.addEventListener(
    "click",
    function(){
        if(currentMode === "quiz"){
            quizToggleMark();
        }else{
            toggleMark();
        }
    }
);

removeBtn.addEventListener(
    "click",
    function(){
        if(currentMode === "quiz"){
            quizRemoveCard();
        }else{
            removeCard();
        }
    }
);

resetBtn.addEventListener(
    "click",
    function(){
        if(currentMode === "quiz"){
            quizResetCards();
        }else{
            resetCards();
        }
    }
);


/* =========================
   START
========================= */

renderCategories();

render();

})();
</script>

</body>
</html>
